<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paperless — free, private invoicing that runs entirely in your browser. Create, preview and download A4 PDF invoices with no account and no server."
    />
    <meta name="theme-color" content="#f2eee4" />
    <title>Paperless — Free Invoice Generator</title>
    <script>
      // Set the theme before first paint to avoid a light flash in dark mode. Mirrors src/hooks/useTheme.ts.
      try {
        var t = localStorage.getItem('paperless:theme')
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
